<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Файлы Георгия Иванова Giry</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(28, 58, 173, 0.1) 0%, transparent 55%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.1) 0%, transparent 55%);
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: rgba(18, 18, 18, 0.9);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .timer-container {
            text-align: center;
            padding: 40px;
            margin: 30px 0;
            background-color: rgba(10, 10, 10, 0.8);
            border-radius: 16px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        #timer {
            font-size: 5rem;
            font-weight: 800;
            font-family: 'Courier New', monospace;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.7);
            margin: 20px 0;
            letter-spacing: 3px;
        }

        .timer-label {
            color: #8b5cf6;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.5);
        }

        .btn-reset {
            background: #ef4444;
        }

        .btn-start {
            background: #10b981;
        }

        .btn-access {
            background: #f59e0b;
        }

        .access-button {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 30px auto 0;
            padding: 15px 30px;
            background: linear-gradient(90deg, #10b981, #059669);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
            display: none;
        }

        .access-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            #timer {
                font-size: 3.5rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 250px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-lock"></i> Файлы Георгия Иванова Giry</h1>
        </div>
        
        <div class="timer-container">
            <div class="timer-label">Таймер до 22:00</div>
            <div id="timer">13:00:00</div>
            
            <div class="controls">
                <button class="btn btn-start" onclick="startTimer()">
                    <i class="fas fa-play"></i> Запустить таймер
                </button>
                <button class="btn" onclick="resetTimer()">
                    <i class="fas fa-redo"></i> Сбросить
                </button>
                <button class="btn btn-access" onclick="grantAccess()">
                    <i class="fas fa-unlock"></i> Открыть доступ сейчас
                </button>
            </div>
        </div>
        
        <a href="video.html" class="access-button pulse" id="accessButton">
            <i class="fas fa-play-circle"></i> Перейти к файлам
        </a>
    </div>

    <script>
        // Начальное время: 13 часов (для примера)
        let hours = 13;
        let minutes = 0;
        let seconds = 0;
        let timerRunning = false;
        let timerInterval = null;
        const ACCESS_KEY = 'georgy_giry_access';
        
        // Обновление таймера
        function updateTimerDisplay() {
            document.getElementById('timer').textContent = 
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        
        // Запуск таймера
        function startTimer() {
            if (timerRunning) return;
            
            timerRunning = true;
            timerInterval = setInterval(() => {
                if (seconds > 0) {
                    seconds--;
                } else {
                    if (minutes > 0) {
                        minutes--;
                        seconds = 59;
                    } else {
                        if (hours > 0) {
                            hours--;
                            minutes = 59;
                            seconds = 59;
                        } else {
                            // Таймер завершен
                            clearInterval(timerInterval);
                            timerRunning = false;
                            grantAccess();
                            showAccessGranted();
                            return;
                        }
                    }
                }
                updateTimerDisplay();
                
                // Проверяем, завершился ли таймер
                if (hours === 0 && minutes === 0 && seconds === 0) {
                    clearInterval(timerInterval);
                    timerRunning = false;
                    grantAccess();
                    showAccessGranted();
                }
            }, 1000);
        }
        
        // Сброс таймера
        function resetTimer() {
            clearInterval(timerInterval);
            timerRunning = false;
            hours = 13;
            minutes = 0;
            seconds = 0;
            updateTimerDisplay();
            localStorage.removeItem(ACCESS_KEY);
            document.getElementById('accessButton').style.display = 'none';
        }
        
        // Предоставить доступ
        function grantAccess() {
            localStorage.setItem(ACCESS_KEY, 'true');
            localStorage.setItem('accessGranted', 'true');
            showAccessGranted();
        }
        
        // Показать доступ открыт
        function showAccessGranted() {
            document.getElementById('timer').textContent = "00:00:00";
            document.getElementById('timer').style.color = '#10b981';
            document.getElementById('timer').style.textShadow = '0 0 30px rgba(16, 185, 129, 0.7)';
            document.getElementById('accessButton').style.display = 'block';
        }
        
        // Проверка доступа при загрузке
        function checkAccess() {
            if (localStorage.getItem(ACCESS_KEY) === 'true') {
                showAccessGranted();
            }
        }
        
        // Инициализация
        window.addEventListener('load', function() {
            updateTimerDisplay();
            checkAccess();
            
            // Автозапуск таймера через 2 секунды
            setTimeout(() => {
                if (!timerRunning && localStorage.getItem(ACCESS_KEY) !== 'true') {
                    startTimer();
                }
            }, 2000);
        });
    </script>
</body>
</html>
